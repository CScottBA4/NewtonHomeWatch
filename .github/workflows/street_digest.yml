name: NewtonHomeWatch - Clark Street

on:
  schedule:
    # Sunday morning (UTC schedule; roughly 9-10am Eastern).
    - cron: '10 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newtonhomewatch-state
  cancel-in-progress: false

jobs:
  street-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Clark Street weekly digest
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python street_activity.py

      - name: Commit monitor state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/street_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NewtonHomeWatch street state"
            git pull --rebase origin main
            git push
          else
            echo "No street-state changes to commit"
          fi
