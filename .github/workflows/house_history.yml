name: NewtonHomeWatch - House History

on:
  schedule:
    # First day of each month (UTC schedule; roughly 9-10am Eastern).
    - cron: '20 14 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newtonhomewatch-state
  cancel-in-progress: false

jobs:
  house-history:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build 162 Clark Street house history
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python house_history.py

      - name: Commit house-history archive
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/house_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NewtonHomeWatch house history"
            git pull --rebase origin main
            git push
          else
            echo "No house-history changes to commit"
          fi
